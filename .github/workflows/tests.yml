################################################################################
# tests.yml
# GitHub Actions Workflow for running the tests for the pcollections library.
# by Noah C. Benson

name: CI

# We run on either pushes or pulls into main or dev branches
on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '/.github/workflows/deploy.yml'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '/.github/workflows/deploy.yml'
  # We sometimes want to run this manually.
  workflow_dispatch:
  # We also sometimes want to run this from another workflow.
  workflow_call:

# Our only job in this case is to test the code.
jobs:
  test:
    name: ${{matrix.version}}/${{matrix.os}}/${{matrix.arch}} - ${{github.event_name}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13
        arch:
          - 'x64'
        include:
          - {"os": "macos-13", "arch": "x64", "version": "3.7"}
          - {"os": "windows-latest", "arch": "x64", "version": "3.7"}
          # Apple Silicon (arm64): pcollections now ships C extensions, and
          # Apple Silicon's stricter alignment/atomics behavior is exactly
          # the kind of thing that can differ from x64 for lazy.c's
          # stdatomic.h-based thread-safety code, so this isn't just a
          # "same code, different label" matrix entry.
          - {"os": "macos-latest", "arch": "arm64", "version": "3.8"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.9"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.10"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.11"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.12"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.13"}
          - {"os": "macos-latest", "arch": "arm64", "version": "3.14"}
          # Linux/arm64 (GitHub-hosted arm64 Ubuntu runners): a second,
          # independent arm64 target with a different OS/libc/compiler
          # (glibc + gcc, vs. macOS's libc++/clang) than macos-latest/arm64
          # above -- worth covering separately for a project with real C
          # extensions rather than assuming "arm64 is arm64."
          - {"os": "ubuntu-24.04-arm", "arch": "arm64", "version": "3.8"}
          - {"os": "ubuntu-24.04-arm", "arch": "arm64", "version": "3.9"}
          - {"os": "ubuntu-24.04-arm", "arch": "arm64", "version": "3.10"}
          - {"os": "ubuntu-24.04-arm", "arch": "arm64", "version": "3.11"}
          - {"os": "ubuntu-24.04-arm", "arch": "arm64", "version": "3.12"}
          - {"os": "ubuntu-24.04-arm", "arch": "arm64", "version": "3.13"}
          - {"os": "ubuntu-24.04-arm", "arch": "arm64", "version": "3.14"}
    # The job environment.
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      PYTHON: ${{ matrix.version }}
    # The steps in the job.
    steps:
      # Check out the repository (goes to $GITHUB_WORKSPACE)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '2'
      # Setup the Python Environment.
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
      - name: Upgrade Setuptools
        run: |
          python -m pip install --upgrade setuptools
      # Log the Python Version
      - name: Display Python version
        run: python --version
      - name: Diagnose C extension build (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          python setup.py build_ext --inplace --verbose
      # Run the actual tests.
      - name: Run Tests
        run: |
          pip install -e .
          #pip install coverage
          cd ~
          #coverage run -m pcollections.test
          python -m pcollections.test
      # pcollections._c (dict/list/set/lazy) is an optional set of C
      # extension modules: pcollections/__init__.py falls back to the
      # pure-Python implementation when they aren't built for a given
      # platform/toolchain (e.g. likely on Windows, where MSVC's
      # <stdatomic.h> support is limited -- see setup.py), and
      # pcollections.test above already runs against whichever backend(s)
      # ended up available. This step doesn't gate the job (a pure-Python
      # fallback is a valid, fully-tested outcome, not a failure) -- it
      # just surfaces which backend this job actually exercised, so that's
      # visible at a glance in the Actions log/summary instead of only
      # showing up as an absence of C-specific tests deep in the test
      # output.
      - name: Report which backend was tested
        run: |
          python -c "import pcollections; print('pcollections.using_c_extension =', pcollections.using_c_extension)"
#      - name: Process Code Coverage
#        uses: codecov/codecov-action@v1
