################################################################################
# deploy.yml
# GitHub Actions workflow that publishes pcollections to PyPI.
# by Noah C. Benson
#
# Publishing uses PyPI's trusted publishing, so no API token is stored in the
# repository. On PyPI, the pcollections project must list this repository,
# this workflow (deploy.yml), and the environment `pypi` as a trusted
# publisher.

name: Deploy to PyPI

on:
  workflow_dispatch:

jobs:
  # The full test matrix must pass first.
  test-matrix:
    name: Full test matrix
    uses: ./.github/workflows/tests.yml

  # The source distribution. Platforms without a wheel install from it,
  # compiling the C extension (or using the pure-Python backend if that
  # fails).
  build-sdist:
    name: Source distribution
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build the sdist
        run: |
          pip install --upgrade build
          python -m build --sdist
      - name: Upload the sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # Binary wheels, one job per runner. The build selection and the test
  # command are in pyproject.toml ([tool.cibuildwheel]); the test command
  # requires the C backend, so a wheel whose extension didn't compile is
  # never published.
  build-wheels:
    name: Wheels / ${{ matrix.os }}
    needs: test-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
      - name: Upload the wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Uploads the sdist and all wheels to PyPI.
  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pcollections/
    permissions:
      # Required for trusted publishing.
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List the distributions
        run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
